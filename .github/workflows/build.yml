name: Build Sahi Game APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@v5
      with:
        tool-cache: false
        android: false
        dotnet: false
        haskell: false
        large-storage: false

    - name: Set up Swap Space (Prevents Freezing)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev ccache

    - name: Build with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: sahi_game_apk
        path: bin/*.apk
